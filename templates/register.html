{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="text-center mb-4">
      <h3 class="brand-mark mb-1"><i class="fa-solid fa-wallet me-2"></i>PocketWise</h3>
      <p class="text-muted mb-0">Create your free account</p>
    </div>
    <form method="POST" action="{{ url_for('auth.register') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label fw-semibold">Full name</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
          <input type="text" name="name" class="form-control" required minlength="2"
                 placeholder="Your full name" value="{{ name or '' }}">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Email address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
          <input type="email" name="email" class="form-control" required
                 placeholder="you@example.com" value="{{ email or '' }}">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
          <input type="password" name="password" class="form-control" required minlength="6" placeholder="Minimum 6 characters">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Confirm password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
          <input type="password" name="confirm_password" class="form-control" required minlength="6" placeholder="Repeat your password">
        </div>
      </div>
      <button type="submit" class="btn btn-gradient w-100 py-2">
        <i class="fa-solid fa-user-plus me-2"></i>Create Account
      </button>
      <p class="text-center text-muted small mt-3 mb-0">
        Already have an account?
        <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-semibold">Log in</a>
      </p>
    </form>
  </div>
</div>
{% endblock %}
