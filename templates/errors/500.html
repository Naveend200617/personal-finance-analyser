{% extends "base.html" %}
{% block title %}500 Server Error{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card text-center">
    <i class="fa-solid fa-triangle-exclamation display-1 text-danger mb-3"></i>
    <h2 class="fw-bold">Something went wrong</h2>
    <p class="text-muted">An unexpected error occurred. Please try again in a moment.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-gradient px-4">
      <i class="fa-solid fa-house me-2"></i>Back to Dashboard
    </a>
  </div>
</div>
{% endblock %}
