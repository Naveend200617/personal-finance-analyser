{% extends "base.html" %}
{% block title %}404 Not Found{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card text-center">
    <i class="fa-solid fa-circle-question display-1 text-primary mb-3"></i>
    <h2 class="fw-bold">Page not found</h2>
    <p class="text-muted">The page you're looking for doesn't exist or was moved.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-gradient px-4">
      <i class="fa-solid fa-house me-2"></i>Back to Dashboard
    </a>
  </div>
</div>
{% endblock %}
