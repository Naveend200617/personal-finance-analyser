{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="text-center mb-4">
      <h3 class="brand-mark mb-1"><i class="fa-solid fa-wallet me-2"></i>PocketWise</h3>
      <p class="text-muted mb-0">Sign in to manage your finances</p>
    </div>
    <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label fw-semibold">Email address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
          <input type="email" name="email" class="form-control" required
                 placeholder="you@example.com" value="{{ email or '' }}">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
          <input type="password" name="password" class="form-control" required placeholder="••••••••">
        </div>
      </div>
      <button type="submit" class="btn btn-gradient w-100 py-2">
        <i class="fa-solid fa-right-to-bracket me-2"></i>Login
      </button>
      <p class="text-center text-muted small mt-3 mb-0">
        New to PocketWise?
        <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-semibold">Create an account</a>
      </p>
    </form>
  </div>
</div>
{% endblock %}
